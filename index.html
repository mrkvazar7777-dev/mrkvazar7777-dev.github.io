<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>СменаПро — График смен и расчет зарплаты</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0D0F14;
      color: #F4F6FA;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: #171A21;
      border: 1px solid #282E3A;
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: rgba(0, 229, 160, 0.12);
      color: #00E5A0;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 18px;
    }
    h1 { font-size: 28px; margin-bottom: 12px; }
    p { color: #8B93A6; line-height: 1.6; margin-bottom: 28px; font-size: 15px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a.btn {
      display: block;
      padding: 14px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
    }
    .primary { background: #00E5A0; color: #0D0F14; }
    .secondary { background: #1F242E; color: #F4F6FA; border: 1px solid #282E3A; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Android • RuStore</div>
    <h1>СменаПро</h1>
    <p>Удобный календарь рабочих смен (2/2, 3/3, сутки/трое и любые циклы), автоматический расчет зарплаты с НДФЛ и умные напоминания. Все данные хранятся локально на вашем устройстве.</p>
    <div class="links">
      <!-- После публикации в RuStore замени # на прямую ссылку на приложение -->
      <a class="btn primary" href="#">Скачать в RuStore</a>
      <a class="btn secondary" href="privacy.html">Политика конфиденциальности</a>
    </div>
  </div>
</body>
</html>
